server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Prerendered routes (/, /docs, /docs/apple-app-password,
    # /docs/quickstart-walkthrough) are real directories with their own
    # index.html, so $uri/ resolves them directly with no rewrite needed.
    #
    # Everything else (/dashboard/* and any unknown path) has no static file
    # on disk — fall back to the root index.html so the client-side router
    # takes over, exactly like a normal SPA deploy. That index.html has an
    # empty <div id="root">, so this is a plain client render, not a mismatched
    # hydration of some other page's prerendered markup.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
